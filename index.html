<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="utf-8"/>
        <title>My Snowglobe</title>
        <link rel = "stylesheet" href = "style.css"/>
    </head>
    <body>
    <header class = "hero">
        <h1>My Snowglobe</h1>
        <p class = "tagline">The things I wish my younger self knew. Shake to know these things for the future!</p>
    </header>
    <main>
        <section class="globe-card">
    <div class = "globe" id = "globe">
        <img src = "snowglobe.png" alt = "Snowglobe" class = "snowglobe"/>
    </div>
    <div class = "snow" id = "snow">
        <img src = "snowfalling.gif" alt = "Snow Flakes falling" class = "snowglobe" />
    </div>
    <div class = "rightSnow" id="rightSnow">
        <img src = "SnowFalling2.gif" alt = "Snow Flakes falling" class = "snowglobe" />
    </div>
    <div class = "FallingStars" id="FallingStars">
        <img src = "Stars.gif" alt = "Stars Falling" class = "snowglobe" />
    </div>
    <button id ="shake">Shake!</button>
    <p class = "message" id = "message">Press the button to shake the snowglobe!</p>
    </section>
    </main>
        <footer>
            <p>Made by Hanaa, in the snow</p>
        </footer>
    <script src= "script.js"></script>
    </body>
</html>
